<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO Tag Plugin -->
  {% seo %}

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ " /images/favicon.svg" | prepend: site.baseurl }}">
  <link rel="manifest" href="{{ " /manifest.json" | prepend: site.baseurl }}">
  <meta name="theme-color" content="#2c3e50">
  <link rel="apple-touch-icon" href="{{ " /images/favicon.svg" | prepend: site.baseurl }}">

  <!-- MathJax for mathematical notation -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
      }
    };
  </script>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <link rel="stylesheet" href="{{ " /css/main.css" | prepend: site.baseurl }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ " /feed.xml" | prepend:
    site.baseurl | prepend: site.url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Mermaid diagrams -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true, theme: 'default' });
  </script>

  <!-- Reading progress bar logic -->
  <script>
    document.addEventListener('scroll', () => {
      const progress = document.getElementById('reading-progress');
      if (!progress) return;
      const scrollTotal = document.documentElement.scrollHeight - window.innerHeight;
      const scrollPos = window.scrollY;
      const scrollPercent = (scrollPos / scrollTotal) * 100;
      progress.style.width = scrollPercent + '%';
    });
  </script>
</head>
