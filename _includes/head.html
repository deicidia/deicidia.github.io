<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval' https:;">

  <!-- SEO Tag Plugin -->
  {% seo %}

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ "/images/favicon.svg" | prepend: site.baseurl }}">
  <link rel="manifest" href="{{ "/manifest.json" | prepend: site.baseurl }}">
  <meta name="theme-color" content="#2c3e50">
  <link rel="apple-touch-icon" href="{{ "/images/favicon.svg" | prepend: site.baseurl }}">

  <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Reading progress bar logic -->
  <script>
    document.addEventListener('scroll', () => {
      const progress = document.getElementById('reading-progress');
      if (!progress) return;
      const scrollTotal = document.documentElement.scrollHeight - window.innerHeight;
      const scrollPos = window.scrollY;
      const scrollPercent = (scrollPos / scrollTotal) * 100;
      progress.style.width = scrollPercent + '%';
    });
  </script>

  <!-- Page Transitions -->
  <script src="{{ "/js/transitions.js" | prepend: site.baseurl }}" defer></script>
</head>
